<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Word Combat — Hub</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/hub.css" />
</head>
<body>
  <div class="container">
    <header class="topbar" role="banner">
      <div>
        <h1 class="title">Word Combat</h1>
        <div class="subtitle">Criar ou entrar em salas</div>
      </div>

      <div class="user-block" aria-hidden="false">
        <div id="me-name" class="me-name">—</div>
        <button id="btn-profile" class="tiny-btn" type="button">Perfil</button>
        <button id="btn-logout" class="tiny-btn ghost" type="button">Sair</button>
      </div>
    </header>

    <main style="margin-top:14px;">
      <section class="card">
        <div class="create-area">
          <input id="room-name" class="input" placeholder="Nome da sala (opcional)" />
          <button id="create-room" class="btn">Criar Sala</button>
          <button id="refresh-rooms" class="btn secondary">Atualizar</button>
        </div>

        <div class="rooms" id="rooms-list" aria-live="polite" style="margin-top:12px;">
          <div class="empty">Carregando salas...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
