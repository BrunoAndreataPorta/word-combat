<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Word Combat — Palavras Cruzadas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <h1>Word Combat</h1>
    <p class="subtitle">Entre em uma épica batalha para expandir seu vocabulário</p>

    <div class="user-area" aria-hidden="false">
      <div id="me-name-top" class="me-name">—</div>
      <button id="btn-leave" class="tiny-btn" type="button">SAIR</button>
    </div>
  </header>

  <main class="layout">
    <aside class="left">
      <div id="score" class="score"><span class="label">Placar</span><span class="value">0</span></div>
      <div id="timer" class="timer">⏱️ 03:00</div>

      <div id="clues" class="clues">
        <h2>Dicas</h2>
        <ul id="clues-list"></ul>
      </div>
    </aside>

    <section class="board">
      <div id="grid-container" class="grid-container" aria-hidden="false"></div>
    </section>
  </main>

  <script src="/js/leave.js"></script>
  <script src="js/game.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
